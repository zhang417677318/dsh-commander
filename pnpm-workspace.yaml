# pnpm 11 起，安装脚本白名单等设置的家在这里，不再读 package.json 的 pnpm 字段。
# 键名是 allowBuilds（旧文档里的 onlyBuiltDependencies 已不生效）。
packages:
  - .

allowBuilds:
  # electron 的 postinstall 负责下载运行时二进制（约 245 MB）。
  # 国内直连 GitHub releases 会 fetch failed，需要先设镜像：
  #   $env:ELECTRON_MIRROR = 'https://npmmirror.com/mirrors/electron/'
  electron: true
  # electron-builder 的依赖，只在构建 Squirrel 安装包时才需要。
  # 我们走 NSIS / 免安装目录，用不到，显式标记为不构建以免 pnpm 一直报警。
  electron-winstaller: false
  esbuild: true
